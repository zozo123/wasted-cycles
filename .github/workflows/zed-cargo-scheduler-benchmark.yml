name: Zed Cargo scheduler benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - .github/zed-benchmark-trigger/**

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CARGO_BASE_SHA: 8ea62e927ca2875b7839b8c5110f3e4fdfdf58c3
      CARGO_HEAD_SHA: b1941b55d1b1a311c6a20b93ada622267c3d35b3
      ZED_SHA: 5e03f2d387e629237c10a4e4fed881b64abd8fea
      CARGO_TERM_COLOR: never

    steps:
      - name: Prepare runner and sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/results" "$RUNNER_TEMP/bin"
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "os=$(uname -a)"
            echo "cpus=$(nproc)"
            echo "memory_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            lscpu
            df -h
          } > "$RUNNER_TEMP/results/system.txt"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo apt-get clean

          git init "$RUNNER_TEMP/zed"
          cd "$RUNNER_TEMP/zed"
          git remote add origin https://github.com/zed-industries/zed.git
          git fetch --depth 1 origin "$ZED_SHA"
          git checkout --detach FETCH_HEAD
          ./script/linux
          rustup toolchain install 1.97.0 --profile minimal
          rustup toolchain install 1.95.0 --profile minimal
          rustup run 1.97.0 rustc --version --verbose > "$RUNNER_TEMP/results/rust-1.97.txt"
          rustup run 1.95.0 rustc --version --verbose > "$RUNNER_TEMP/results/rust-1.95.txt"

      - name: Build exact Cargo base and PR binaries
        shell: bash
        run: |
          set -euxo pipefail
          git init "$RUNNER_TEMP/cargo-src"
          cd "$RUNNER_TEMP/cargo-src"
          git remote add upstream https://github.com/rust-lang/cargo.git
          git remote add fork https://github.com/zozo123/cargo.git
          git fetch --depth 1 upstream "$CARGO_BASE_SHA"
          git branch cargo-base FETCH_HEAD
          git fetch --depth 1 fork "$CARGO_HEAD_SHA"
          git branch cargo-head FETCH_HEAD
          git worktree add --detach "$RUNNER_TEMP/cargo-base" cargo-base
          git worktree add --detach "$RUNNER_TEMP/cargo-head" cargo-head

          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-base-target" \
            cargo +1.97.0 build --release --locked --bin cargo \
            --manifest-path "$RUNNER_TEMP/cargo-base/Cargo.toml"
          cp "$RUNNER_TEMP/cargo-base-target/release/cargo" "$RUNNER_TEMP/bin/cargo-base"

          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-head-target" \
            cargo +1.97.0 build --release --locked --bin cargo \
            --manifest-path "$RUNNER_TEMP/cargo-head/Cargo.toml"
          cp "$RUNNER_TEMP/cargo-head-target/release/cargo" "$RUNNER_TEMP/bin/cargo-head"
          chmod +x "$RUNNER_TEMP/bin/cargo-base" "$RUNNER_TEMP/bin/cargo-head"
          "$RUNNER_TEMP/bin/cargo-base" --version --verbose > "$RUNNER_TEMP/results/cargo-base-version.txt"
          "$RUNNER_TEMP/bin/cargo-head" --version --verbose > "$RUNNER_TEMP/results/cargo-head-version.txt"
          sha256sum "$RUNNER_TEMP/bin/cargo-base" "$RUNNER_TEMP/bin/cargo-head" > "$RUNNER_TEMP/results/cargo-binaries.sha256"

          rm -rf "$RUNNER_TEMP/cargo-base-target" "$RUNNER_TEMP/cargo-head-target" \
                 "$RUNNER_TEMP/cargo-base" "$RUNNER_TEMP/cargo-head" "$RUNNER_TEMP/cargo-src"

      - name: Resolve dependencies and characterize Zed unit graph
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/zed"
          export RUSTUP_TOOLCHAIN=1.95.0
          export CARGO_TARGET_DIR="$RUNNER_TEMP/zed-target"
          "$RUNNER_TEMP/bin/cargo-base" fetch --locked
          "$RUNNER_TEMP/bin/cargo-base" -Z unstable-options check -p zed --locked --unit-graph \
            > "$RUNNER_TEMP/results/unit-graph.json"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'results', 'unit-graph.json')
          with open(p) as f:
              data = json.load(f)
          units = data.get('units', [])
          out = {
              'zed_sha': os.environ['ZED_SHA'],
              'cargo_base_sha': os.environ['CARGO_BASE_SHA'],
              'cargo_head_sha': os.environ['CARGO_HEAD_SHA'],
              'units': len(units),
              'initially_ready_units': sum(1 for u in units if not u.get('dependencies', [])),
              'dependency_edges': sum(len(u.get('dependencies', [])) for u in units),
          }
          outp = os.path.join(os.environ['RUNNER_TEMP'], 'results', 'unit-graph-summary.json')
          with open(outp, 'w') as f:
              json.dump(out, f, indent=2, sort_keys=True)
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          gzip -9 "$RUNNER_TEMP/results/unit-graph.json"

      - name: Prime shared Zed target
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/zed"
          export RUSTUP_TOOLCHAIN=1.95.0
          export CARGO_TARGET_DIR="$RUNNER_TEMP/zed-target"
          /usr/bin/time -v -o "$RUNNER_TEMP/results/prime-time.txt" \
            "$RUNNER_TEMP/bin/cargo-base" check -p zed --locked
          "$RUNNER_TEMP/bin/cargo-head" check -q -p zed --locked
          "$RUNNER_TEMP/bin/cargo-base" check -q -p zed --locked
          "$RUNNER_TEMP/bin/cargo-head" check -q -p zed --locked

      - name: Benchmark alternating warm no-op checks
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/zed"
          python3 - <<'PY'
          import csv, json, os, random, statistics, subprocess, time
          root = os.environ['RUNNER_TEMP']
          zed = os.path.join(root, 'zed')
          results = os.path.join(root, 'results')
          bins = {'base': os.path.join(root, 'bin', 'cargo-base'), 'head': os.path.join(root, 'bin', 'cargo-head')}
          env = os.environ.copy()
          env.update({'RUSTUP_TOOLCHAIN': '1.95.0', 'CARGO_TARGET_DIR': os.path.join(root, 'zed-target'), 'CARGO_NET_OFFLINE': 'true', 'CARGO_TERM_COLOR': 'never'})
          rows = []
          blocks = 25
          for block in range(blocks):
              order = ('base', 'head') if block % 2 == 0 else ('head', 'base')
              for position, variant in enumerate(order):
                  start = time.perf_counter_ns()
                  proc = subprocess.run([bins[variant], 'check', '-q', '-p', 'zed', '--locked'], cwd=zed, env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  elapsed_ms = (time.perf_counter_ns() - start) / 1_000_000
                  if proc.returncode != 0:
                      raise SystemExit(f'{variant} failed: {proc.stderr[-4000:]}')
                  rows.append({'block': block, 'position': position, 'variant': variant, 'elapsed_ms': elapsed_ms})
                  print(f'block={block:02d} position={position} variant={variant} elapsed_ms={elapsed_ms:.3f}')
          with open(os.path.join(results, 'wall-runs.csv'), 'w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          values = {v: [r['elapsed_ms'] for r in rows if r['variant'] == v] for v in bins}
          paired = []
          for block in range(blocks):
              br = {r['variant']: r['elapsed_ms'] for r in rows if r['block'] == block}
              paired.append(br['base'] - br['head'])
          def percentile(xs, p):
              ys = sorted(xs); k = (len(ys) - 1) * p; lo = int(k); hi = min(lo + 1, len(ys) - 1)
              return ys[lo] + (ys[hi] - ys[lo]) * (k - lo)
          random.seed(17281)
          boot = []
          for _ in range(20000):
              sample = [paired[random.randrange(len(paired))] for _ in paired]
              boot.append(statistics.mean(sample))
          summary = {}
          for variant, xs in values.items():
              summary[variant] = {'n': len(xs), 'mean_ms': statistics.mean(xs), 'median_ms': statistics.median(xs), 'stdev_ms': statistics.stdev(xs), 'min_ms': min(xs), 'p95_ms': percentile(xs, 0.95), 'max_ms': max(xs)}
          bm = summary['base']['median_ms']; hm = summary['head']['median_ms']
          summary['comparison'] = {
              'median_difference_ms_base_minus_head': bm - hm,
              'median_improvement_percent': (bm - hm) / bm * 100,
              'median_speedup_ratio': bm / hm,
              'paired_mean_difference_ms_base_minus_head': statistics.mean(paired),
              'paired_mean_difference_95ci_ms': [percentile(boot, 0.025), percentile(boot, 0.975)],
          }
          with open(os.path.join(results, 'wall-summary.json'), 'w') as f:
              json.dump(summary, f, indent=2, sort_keys=True)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Capture Cargo internal profiler traces
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/zed"
          python3 - <<'PY'
          import glob, json, os, subprocess, time
          root = os.environ['RUNNER_TEMP']; zed = os.path.join(root, 'zed'); results = os.path.join(root, 'results')
          bins = {'base': os.path.join(root, 'bin', 'cargo-base'), 'head': os.path.join(root, 'bin', 'cargo-head')}
          env = os.environ.copy(); env.update({'RUSTUP_TOOLCHAIN': '1.95.0', 'CARGO_TARGET_DIR': os.path.join(root, 'zed-target'), 'CARGO_NET_OFFLINE': 'true', 'CARGO_TERM_COLOR': 'never', 'CARGO_LOG_PROFILE': '1'})
          rows = []
          for block in range(7):
              order = ('base', 'head') if block % 2 == 0 else ('head', 'base')
              for variant in order:
                  for old in glob.glob(os.path.join(zed, 'trace-*.json')): os.remove(old)
                  start = time.perf_counter_ns()
                  proc = subprocess.run([bins[variant], 'check', '-q', '-p', 'zed', '--locked'], cwd=zed, env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  wall_ms = (time.perf_counter_ns() - start) / 1_000_000
                  if proc.returncode != 0: raise SystemExit(proc.stderr[-4000:])
                  traces = glob.glob(os.path.join(zed, 'trace-*.json'))
                  if len(traces) != 1: raise SystemExit(f'expected one trace, got {traces}')
                  with open(traces[0]) as f: data = json.load(f)
                  events = data.get('traceEvents', data if isinstance(data, list) else [])
                  complete = [e for e in events if isinstance(e, dict) and e.get('ph') == 'X' and isinstance(e.get('dur'), (int, float))]
                  candidates = [e for e in complete if 'execute' in str(e.get('name', '')).lower()]
                  row = {'block': block, 'variant': variant, 'wall_ms': wall_ms, 'execute_events': [{'name': e.get('name'), 'dur_us': e.get('dur')} for e in candidates]}
                  rows.append(row)
                  os.replace(traces[0], os.path.join(results, f'trace-{variant}-{block}.json'))
          with open(os.path.join(results, 'profile-events.json'), 'w') as f: json.dump(rows, f, indent=2)
          print(json.dumps(rows, indent=2))
          PY

      - name: Render report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          r = os.path.join(os.environ['RUNNER_TEMP'], 'results')
          lines = ['# Zed Cargo scheduler benchmark', '', f"Zed: `{os.environ['ZED_SHA']}`", f"Cargo base: `{os.environ['CARGO_BASE_SHA']}`", f"Cargo PR: `{os.environ['CARGO_HEAD_SHA']}`", '']
          for name, heading in [('unit-graph-summary.json', 'Unit graph'), ('wall-summary.json', 'Warm no-op wall time')]:
              p = os.path.join(r, name)
              if os.path.exists(p):
                  with open(p) as f: data = json.load(f)
                  lines += [f'## {heading}', '', '```json', json.dumps(data, indent=2, sort_keys=True), '```', '']
          with open(os.path.join(r, 'REPORT.md'), 'w') as f: f.write('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zed-cargo-scheduler-benchmark
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 14
