name: Cargo scheduler source artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-cargo-scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QUEUE_SHA: 9c8691d224960d8688e19ef310686c71490cdb05
      __CARGO_TEST_CHANNEL_OVERRIDE_DO_NOT_USE_THIS: nightly
    steps:
      - name: Checkout exact Cargo PR commit
        uses: actions/checkout@v4
        with:
          repository: zozo123/cargo
          ref: ${{ env.QUEUE_SHA }}
          fetch-depth: 0
          path: cargo-pr

      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add --toolchain 1.97.0 rustfmt clippy

      - name: Apply complete scheduler patch
        run: |
          echo '' | base64 -d > /tmp/transform.py
          python3 /tmp/transform.py
          cargo +1.97.0 fmt --manifest-path cargo-pr/Cargo.toml --all
          git -C cargo-pr diff --check
          git -C cargo-pr diff > "$RUNNER_TEMP/final-scheduler.patch"

      - name: Validate exact source
        run: |
          cargo +1.97.0 test --manifest-path cargo-pr/Cargo.toml --lib util::dependency_queue
          cargo +1.97.0 test --manifest-path cargo-pr/Cargo.toml --lib compiler::job_queue::pending_tests
          cargo +1.97.0 clippy --manifest-path cargo-pr/Cargo.toml --lib --tests --benches -- -D warnings
          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target" cargo +1.97.0 build --release --locked --manifest-path cargo-pr/Cargo.toml --bin cargo

      - name: Upload exact validated source
        uses: actions/upload-artifact@v4
        with:
          name: cargo-scheduler-final-source
          path: |
            cargo-pr/src/compiler/job_queue/mod.rs
            ${{ runner.temp }}/final-scheduler.patch
          if-no-files-found: error
