name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must report no files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: Validate GitHub Pages HTML
        run: npx --yes html-validate@11.6.0 docs/index.html

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: go test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile smoke build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="wasted-cycles"
          if [ "$GOOS" = "windows" ]; then
            out="wasted-cycles.exe"
          fi
          go build -trimpath -ldflags "-s -w" -o "/tmp/$out" ./cmd/wasted-cycles
          ls -l "/tmp/$out"

  package-contract:
    name: release packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Package a dry-run release
        env:
          TAG: v0.0.0-ci
        run: bash .github/scripts/package.sh

      - name: Verify the `run` installer contract
        env:
          TAG: v0.0.0-ci
        run: bash .github/scripts/verify-assets.sh

      - name: Exercise ./run end to end
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory dist --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/checksums.txt 2>/dev/null && break
            sleep 0.2
          done

          sed 's#https://github.com/\$repo/releases/latest/download#http://127.0.0.1:8000#' run > /tmp/run-local
          got="$(sh /tmp/run-local --version < /dev/null)"
          echo "./run --version -> $got"
          [ "$got" = "v0.0.0-ci" ]

  shellcheck:
    name: shellcheck shell sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Ensure shellcheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: shellcheck ./run
        run: shellcheck --shell=sh --severity=style run

      - name: shellcheck release scripts
        run: shellcheck --shell=bash --severity=style .github/scripts/*.sh

  demo-json:
    name: demo JSON output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run --demo --json
        run: go run ./cmd/wasted-cycles --demo --json < /dev/null > demo.json

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("demo.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)

          if not isinstance(data, (dict, list)):
              sys.exit("demo output is not a JSON object or array")
          if not data:
              sys.exit("demo output is empty")

          print("valid JSON, top-level type:", type(data).__name__)
          if isinstance(data, dict):
              print("keys:", ", ".join(sorted(data)))
          PY

  cargo-scheduler:
    name: Cargo scheduler final source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QUEUE_SHA: 9c8691d224960d8688e19ef310686c71490cdb05
      __CARGO_TEST_CHANNEL_OVERRIDE_DO_NOT_USE_THIS: nightly
    steps:
      - name: Checkout exact Cargo PR commit
        uses: actions/checkout@v4
        with:
          repository: zozo123/cargo
          ref: ${{ env.QUEUE_SHA }}
          fetch-depth: 0
          path: cargo-pr

      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add --toolchain 1.97.0 rustfmt clippy

      - name: Apply complete scheduler patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cargo-pr/src/compiler/job_queue/mod.rs")
          source = path.read_text()
          source = source.replace(
              "use std::cell::RefCell;\n",
              "use std::cell::RefCell;\nuse std::cmp::Ordering;\nuse std::collections::BinaryHeap;\n",
              1,
          )

          marker = "pub struct JobQueue<'gctx> {\n    queue: DependencyQueue<Unit, Artifact, Job>,\n    counts: HashMap<PackageId, usize>,\n    timings: Timings<'gctx>,\n}\n\n"
          addition = r'''/// A job that is ready to run, ordered by Cargo's scheduling priority.
///
/// `order` preserves the previous sorted-`Vec` behavior for equal priorities:
/// the job dequeued later is scheduled first.
struct Pending<T> {
    value: T,
    priority: usize,
    order: usize,
}

impl<T> PartialEq for Pending<T> {
    fn eq(&self, other: &Self) -> bool {
        self.priority == other.priority && self.order == other.order
    }
}

impl<T> Eq for Pending<T> {}

impl<T> PartialOrd for Pending<T> {
    fn partial_cmp(&self, other: &Self) -> Option<Ordering> {
        Some(self.cmp(other))
    }
}

impl<T> Ord for Pending<T> {
    fn cmp(&self, other: &Self) -> Ordering {
        self.priority
            .cmp(&other.priority)
            .then_with(|| self.order.cmp(&other.order))
    }
}

#[cfg(test)]
mod pending_tests {
    use super::Pending;
    use std::collections::BinaryHeap;

    #[test]
    fn pops_highest_priority_first() {
        let mut queue = BinaryHeap::new();
        queue.push(Pending {
            value: "low",
            priority: 1,
            order: 0,
        });
        queue.push(Pending {
            value: "high",
            priority: 3,
            order: 1,
        });
        queue.push(Pending {
            value: "middle",
            priority: 2,
            order: 2,
        });
        assert_eq!(queue.pop().unwrap().value, "high");
        assert_eq!(queue.pop().unwrap().value, "middle");
        assert_eq!(queue.pop().unwrap().value, "low");
    }

    #[test]
    fn pops_later_equal_priority_job_first() {
        let mut queue = BinaryHeap::new();
        queue.push(Pending {
            value: "first",
            priority: 1,
            order: 0,
        });
        queue.push(Pending {
            value: "second",
            priority: 1,
            order: 1,
        });
        assert_eq!(queue.pop().unwrap().value, "second");
        assert_eq!(queue.pop().unwrap().value, "first");
    }
}

'''
          assert source.count(marker) == 1
          source = source.replace(marker, marker + addition, 1)

          old_fields = "    pending_queue: Vec<(Unit, Job, usize)>,\n    print: DiagnosticPrinter<'gctx>,\n"
          new_fields = "    pending_queue: BinaryHeap<Pending<(Unit, Job)>>,\n    next_pending_order: usize,\n    print: DiagnosticPrinter<'gctx>,\n"
          assert source.count(old_fields) == 1
          source = source.replace(old_fields, new_fields, 1)

          old_init = "            pending_queue: Vec::new(),\n            print: DiagnosticPrinter::new(\n"
          new_init = "            pending_queue: BinaryHeap::new(),\n            next_pending_order: 0,\n            print: DiagnosticPrinter::new(\n"
          assert source.count(old_init) == 1
          source = source.replace(old_init, new_init, 1)

          old_insert = r'''            // We want to keep the pieces of work in the `pending_queue` sorted
            // by their priorities, and insert the current job at its correctly
            // sorted position: following the lower priority jobs, and the ones
            // with the same priority (since they were dequeued before the
            // current one, we also keep that relation).
            let idx = self
                .pending_queue
                .partition_point(|&(_, _, p)| p <= priority);
            self.pending_queue.insert(idx, (unit, job, priority));
'''
          new_insert = r'''            let order = self.next_pending_order;
            self.next_pending_order = self.next_pending_order.checked_add(1).unwrap();
            self.pending_queue.push(Pending {
                value: (unit, job),
                priority,
                order,
            });
'''
          assert source.count(old_insert) == 1
          source = source.replace(old_insert, new_insert, 1)

          old_comment = r'''        // The `pending_queue` is sorted in ascending priority order, and we
        // remove items from its end to schedule the highest priority items
        // sooner.
'''
          assert source.count(old_comment) == 1
          source = source.replace(
              old_comment,
              "        // The max-heap schedules the highest-priority job first.\n",
              1,
          )

          old_pop = "            let (unit, job, _) = self.pending_queue.pop().unwrap();\n"
          new_pop = r'''            let Pending {
                value: (unit, job),
                ..
            } = self.pending_queue.pop().unwrap();
'''
          assert source.count(old_pop) == 1
          source = source.replace(old_pop, new_pop, 1)
          path.write_text(source)
          PY

          cargo +1.97.0 fmt --manifest-path cargo-pr/Cargo.toml --all
          git -C cargo-pr diff --check
          git -C cargo-pr diff > "$RUNNER_TEMP/final-scheduler.patch"

      - name: Validate exact source
        run: |
          cargo +1.97.0 test --manifest-path cargo-pr/Cargo.toml --lib util::dependency_queue
          cargo +1.97.0 test --manifest-path cargo-pr/Cargo.toml --lib compiler::job_queue::pending_tests
          cargo +1.97.0 clippy --manifest-path cargo-pr/Cargo.toml --lib --tests --benches -- -D warnings
          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target" \
            cargo +1.97.0 build --release --locked \
            --manifest-path cargo-pr/Cargo.toml --bin cargo

      - name: Upload exact validated source
        uses: actions/upload-artifact@v4
        with:
          name: cargo-scheduler-final-source
          path: |
            cargo-pr/src/compiler/job_queue/mod.rs
            ${{ runner.temp }}/final-scheduler.patch
          if-no-files-found: error
